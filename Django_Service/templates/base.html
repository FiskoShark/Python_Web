<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}Helpdesk{% endblock %}</title>
    <!--  трохи базових стилів щоб не було гидко дивитись -->
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background: #f4f4f9; }
        nav { background: #333; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        nav a { color: white; text-decoration: none; margin-right: 15px; }
        .container { max-width: 800px; margin: 20px auto; padding: 20px; background: white; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        .btn { padding: 10px 15px; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; text-decoration: none; }
        .btn-danger { background: #dc3545; }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    </style>
</head>
<body>
    <nav>
        <div>
            <a href="/"><strong>Helpdesk</strong></a>
            {% if user.is_authenticated %}
                <a href="{% url 'profile' %}">Мій профіль</a>
            {% endif %}
        </div>
        <div>
            {% if user.is_authenticated %}
                <span style="color: white; margin-right: 10px;">Привіт, {{ user.username }}!</span>
                <a href="{% url 'logout' %}" class="btn btn-danger">Вийти</a>
            {% else %}
                <a href="{% url 'login' %}">Увійти</a>
                <a href="{% url 'register' %}">Реєстрація</a>
            {% endif %}
        </div>
    </nav>

    <div class="container">
        {% block content %}
        <!-- Тут буде основний контент сторінок -->
        {% endblock %}
    </div>
</body>
</html>
