{% extends 'base.html' %}

{% block title %}Вхід{% endblock %}

{% block content %}
    <h2>Вхід у систему</h2>
    
    {% if form.errors %}
        <p style="color: red;">Неправильний логін або пароль. Спробуйте ще раз.</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn">Увійти</button>
    </form>
    <p>Немає акаунту? <a href="{% url 'register' %}">Зареєструйтесь</a></p>
{% endblock %}
